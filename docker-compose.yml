version: '3.8'

services:
  db-prysistema:
    image: mysql:8.0
    container_name: prysistema-db
    environment:
      MYSQL_DATABASE: bd_ventas
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend-prysistema:
    build: .
    container_name: prySistema
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db-prysistema:3306/bd_ventas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db-prysistema

volumes:
  mysql_data: